services:
  db:
    image: postgres:16-alpine
    container_name: abc
    environment:
      POSTGRES_DB: bibliotecario
      POSTGRES_USER: bibliotecario
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibliotecario -d bibliotecario"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    env_file: .env
    container_name: abcd
    environment:
      ASSETS_DIR: /app/assets/images
      DATABASE_URL: postgres://bibliotecario:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/bibliotecario
    ports:
      # Loopback publication by default. Remote dashboard requires direct TLS
      # and an explicitly reviewed network publication preserving client IPs.
      - "127.0.0.1:3059:3050"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
